name: Build

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build mod
    runs-on: ubuntu-latest
    permissions:
      contents: read

    outputs:
      release_version: ${{ steps.version.outputs.version }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Calculate release version
        if: github.event_name == 'push' && (github.ref_name == 'main' || github.ref_name == 'master')
        id: version
        shell: bash
        run: |
          existing_tag="$(git tag --points-at "$GITHUB_SHA" --list 'v[0-9]*' --sort=-version:refname | head -n 1)"
          latest_tag="$(git tag --list 'v[0-9]*' --sort=-version:refname | head -n 1)"

          if [[ -n "$existing_tag" ]]; then
            if [[ ! "$existing_tag" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
              echo "Existing tag '$existing_tag' is not a vMAJOR.MINOR.PATCH tag." >&2
              exit 1
            fi
            version="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.${BASH_REMATCH[3]}"
          elif [[ -z "$latest_tag" ]]; then
            version="$(sed -n 's/^mod_version=//p' gradle.properties | head -n 1)"
            if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "Could not determine initial release version from gradle.properties." >&2
              exit 1
            fi
          else
            if [[ ! "$latest_tag" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
              echo "Latest release tag '$latest_tag' is not a vMAJOR.MINOR.PATCH tag." >&2
              exit 1
            fi
            version="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.$((BASH_REMATCH[3] + 1))"
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build with Gradle
        run: |
          if [[ -n "${RELEASE_VERSION}" ]]; then
            ./gradlew --no-daemon clean build -Pmod_version="${RELEASE_VERSION}"
          else
            ./gradlew --no-daemon clean build
          fi
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}

      - name: Upload mod JARs
        uses: actions/upload-artifact@v4
        with:
          name: bexceptmod-${{ steps.version.outputs.version || 'build' }}-${{ github.sha }}
          path: build/libs/*.jar
          if-no-files-found: error
          compression-level: 0

  release:
    name: Publish GitHub release
    needs: build
    if: github.event_name == 'push' && (github.ref_name == 'main' || github.ref_name == 'master')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download built JARs
        uses: actions/download-artifact@v4
        with:
          name: bexceptmod-${{ needs.build.outputs.release_version }}-${{ github.sha }}
          path: dist

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.build.outputs.release_version }}
        run: |
          tag="v${RELEASE_VERSION}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/*.jar --clobber
          else
            gh release create "$tag" dist/*.jar \
              --title "BExceptMod ${RELEASE_VERSION}" \
              --generate-notes \
              --target "${GITHUB_SHA}"
          fi
