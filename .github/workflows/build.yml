name: Build

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build Minecraft ${{ matrix.minecraft_version }}
    runs-on: ubuntu-latest
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - minecraft_version: 1.21.11
            java_version: '21'
            fabric_api_version: 0.141.6+1.21.11
            modmenu_version: 17.0.1
            cloth_config_version: 21.11.153
          - minecraft_version: 26.1
            java_version: '25'
            fabric_api_version: 0.145.1+26.1
            modmenu_version: 18.0.2
            cloth_config_version: 26.1.154
          - minecraft_version: 26.2
            java_version: '25'
            fabric_api_version: 0.161.0+26.2
            modmenu_version: 20.0.3
            cloth_config_version: 26.2.155
          - minecraft_version: 26.3
            java_version: '25'
            fabric_api_version: 0.165.0+26.3
            modmenu_version: 21.0.0
            cloth_config_version: 26.3.159

    outputs:
      release_version: ${{ steps.version.outputs.version }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Java ${{ matrix.java_version }}
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java_version }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Calculate release version
        if: github.event_name == 'push' && (github.ref_name == 'main' || github.ref_name == 'master')
        id: version
        shell: bash
        run: |
          existing_tag="$(git tag --points-at "$GITHUB_SHA" --list 'v[0-9]*' --sort=-version:refname | head -n 1)"
          latest_tag="$(git tag --list 'v[0-9]*' --sort=-version:refname | head -n 1)"

          if [[ -n "$existing_tag" ]]; then
            if [[ ! "$existing_tag" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
              echo "Existing tag '$existing_tag' is not a vMAJOR.MINOR.PATCH tag." >&2
              exit 1
            fi
            version="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.${BASH_REMATCH[3]}"
          elif [[ -z "$latest_tag" ]]; then
            version="$(sed -n 's/^mod_version=//p' gradle.properties | head -n 1)"
            if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "Could not determine initial release version from gradle.properties." >&2
              exit 1
            fi
          else
            if [[ ! "$latest_tag" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
              echo "Latest release tag '$latest_tag' is not a vMAJOR.MINOR.PATCH tag." >&2
              exit 1
            fi
            version="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.$((BASH_REMATCH[3] + 1))"
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build with Gradle
        run: |
          mod_version="${RELEASE_VERSION:-$(sed -n 's/^mod_version=//p' gradle.properties | head -n 1)}"
          ./gradlew --no-daemon clean build \
            -Pminecraft_version="${MINECRAFT_VERSION}" \
            -Pfabric_api_version="${FABRIC_API_VERSION}" \
            -Pmodmenu_version="${MODMENU_VERSION}" \
            -Pcloth_config_version="${CLOTH_CONFIG_VERSION}" \
            -Pmod_version="${mod_version}"
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          MINECRAFT_VERSION: ${{ matrix.minecraft_version }}
          FABRIC_API_VERSION: ${{ matrix.fabric_api_version }}
          MODMENU_VERSION: ${{ matrix.modmenu_version }}
          CLOTH_CONFIG_VERSION: ${{ matrix.cloth_config_version }}

      - name: Upload mod JARs
        uses: actions/upload-artifact@v7
        with:
          name: bexceptmod-${{ steps.version.outputs.version || 'build' }}-${{ matrix.minecraft_version }}-${{ github.sha }}
          path: build/libs/bexceptmod-${{ matrix.minecraft_version }}-*.jar
          if-no-files-found: error
          compression-level: 0

  release:
    name: Publish GitHub release
    needs: build
    if: github.event_name == 'push' && (github.ref_name == 'main' || github.ref_name == 'master')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download built JARs
        uses: actions/download-artifact@v8
        with:
          pattern: bexceptmod-${{ needs.build.outputs.release_version }}-*-${{ github.sha }}
          path: dist
          merge-multiple: true

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.build.outputs.release_version }}
        run: |
          tag="v${RELEASE_VERSION}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/*.jar --clobber
          else
            gh release create "$tag" dist/*.jar \
              --title "BExceptMod ${RELEASE_VERSION}" \
              --generate-notes \
              --target "${GITHUB_SHA}"
          fi
